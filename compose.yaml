services:
  qdrant:
    image: qdrant/qdrant:v1.17.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  api:
    build:
      context: .
      target: api
    environment:
      API_HOST: 0.0.0.0
      DATA_DIR: /app/data/runtime
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - corpus_data:/app/data/runtime
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      target: mcp
    environment:
      API_URL: http://api:3001
    stdin_open: true
    depends_on:
      api:
        condition: service_healthy
volumes:
  qdrant_data:
  corpus_data:
